# ==================================================
# PrepAI — Docker Compose (Development)
# ==================================================
# Minimal setup for local development.
# Not required for initial development — you can run
# services directly with npm/uvicorn/python.
# ==================================================

version: "3.8"

services:
  # --- MongoDB ---
  mongodb:
    image: mongo:7
    container_name: prepai-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    # environment:
    #   MONGO_INITDB_ROOT_USERNAME: admin
    #   MONGO_INITDB_ROOT_PASSWORD: password

  # --- Backend (FastAPI) ---
